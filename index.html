<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استعلام الإجازات والحضور</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mut:#657182;--ac:#1f6feb;--off:#e5484d;--offbg:#fde8e8;--bd:#dde2ea;--ok:#12805c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mut:#93a1b3;--ac:#5b9dff;--off:#ff7b80;--offbg:#3a2022;--bd:#2c3644;--ok:#4cc79a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mut:#93a1b3;--ac:#5b9dff;--off:#ff7b80;--offbg:#3a2022;--bd:#2c3644;--ok:#4cc79a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.35rem;margin:8px 0 4px}
p.sub{color:var(--mut);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin-bottom:8px}
input{width:100%;font-size:1.1rem;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);direction:ltr;text-align:center;letter-spacing:1px}
button{width:100%;margin-top:12px;font-size:1.05rem;font-weight:700;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--off);margin-top:10px;font-size:.95rem}
.hi{font-size:1.15rem;font-weight:700}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--bd);margin:6px 0 0 6px;font-size:.92rem}
.next{border-color:var(--ok);background:var(--card)}
.next b{color:var(--ok)}
h3{margin:0 0 10px;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.85rem}
.grid .h{color:var(--mut);font-size:.72rem}
.d{padding:6px 0;border-radius:8px}
.d.off{background:var(--offbg);color:var(--off);font-weight:700}
.d.out{color:var(--mut);opacity:.45}
.d.today{outline:2px solid var(--ac)}
.leg{color:var(--mut);font-size:.82rem;margin-top:8px}
.foot{color:var(--mut);font-size:.82rem;text-align:center}
[hidden]{display:none!important}
.tabs{display:flex;gap:8px;margin:0 0 14px}.tab{margin:0;width:auto;flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd);font-size:1rem}.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.mt{display:flex;gap:8px;margin-bottom:12px}.mt button{margin:0;padding:8px;font-size:.95rem;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.mt button.on{background:var(--ac);color:#fff}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.sum div{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center;font-size:.85rem}.sum b{display:block;font-size:1.25rem}
.d.s{padding:4px 0;line-height:1.2}.d.s i{display:block;font-style:normal;font-size:.62rem;opacity:.85}
.c-P{background:#d9f2e6;color:#0b6b46}.c-PH{background:#cfe8ff;color:#0b4f99}.c-WO{background:#e7e3f7;color:#4c3d99}.c-AB{background:#fde0e0;color:#b4232a}.c-ABS{background:#ffe9cc;color:#a85a00}.c-SL{background:#fff3b8;color:#7a6200}.c-PL{background:#d6f0f4;color:#0b6070}.c-EL{background:#f3d9f0;color:#8a2a7e}.c-NJ{background:var(--bg);color:var(--mut);opacity:.55}.c-X{background:var(--bg);color:var(--mut);border:1px dashed var(--bd)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .c-P{background:#12382a;color:#6ee0b0}:root:not([data-theme="light"]) .c-PH{background:#10304f;color:#8ec5ff}:root:not([data-theme="light"]) .c-WO{background:#2a2550;color:#b9aef5}:root:not([data-theme="light"]) .c-AB{background:#4a1f22;color:#ff9a9f}:root:not([data-theme="light"]) .c-ABS{background:#4a3010;color:#ffc27a}:root:not([data-theme="light"]) .c-SL{background:#4a4210;color:#ffe27a}:root:not([data-theme="light"]) .c-PL{background:#0f3a42;color:#7fd8e6}:root:not([data-theme="light"]) .c-EL{background:#40203b;color:#f0a8e8}}
.lg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:.78rem}.lg span{padding:2px 8px;border-radius:6px}
</style>
</head>
<body>
<main>
<h1>استعلام الإجازات والحضور</h1>
<div class="tabs"><button class="tab on" data-t="1">جدول الإجازات</button><button class="tab" data-t="2">الحضور</button></div>
<section id="s1">
<p class="sub">اكتب كود الموظف لتشوف شيفتك وأيام إجازتك.</p>
<div class="card" id="f">
<label for="ph">كود الموظف</label>
<input id="ph" type="tel" inputmode="numeric" autocomplete="off" placeholder="مثال: 1036" maxlength="10">
<button id="go">عرض جدولي</button>
<div class="err" id="err" hidden></div>
</div>
<div id="res" hidden></div>
</section>
<section id="s2" hidden>
<p class="sub">اكتب كود الموظف لتشوف حضورك وغيابك.</p>
<div class="card"><label for="ph2">كود الموظف</label><input id="ph2" type="tel" inputmode="numeric" autocomplete="off" placeholder="مثال: 1036" maxlength="10"><button id="go2">عرض حضوري</button><div class="err" id="err2" hidden></div></div>
<div id="res2" hidden></div>
</section>
<p class="foot">لو بياناتك مش ظاهرة أو فيها خطأ، كلّم الـ HR.</p>
</main>

function hex(s){var a=new Uint8Array(s.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(s.substr(i*2,2),16);return a}
function toHex(u){return Array.prototype.map.call(u,function(b){return("0"+b.toString(16)).slice(-2)}).join("")}
function digits(s){return s.replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/\D/g,"")}
async function lookup(raw,DB,SALT){
  var k=digits(raw).replace(/^0+/,"");
  if(!k)return null;
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(k),"PBKDF2",false,["deriveBits"]);
  var bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:hex(SALT),iterations:ITER},base,320));
  var rec=DB[toHex(bits.slice(0,8))];
  if(!rec)return null;
  var buf=Uint8Array.from(atob(rec),function(c){return c.charCodeAt(0)});
  var key=await crypto.subtle.importKey("raw",bits.slice(8),"AES-GCM",false,["decrypt"]);
  try{var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},key,buf.slice(12));
    return JSON.parse(new TextDecoder().decode(pt))}catch(e){return null}
}
function iso(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function fmt(s){var d=new Date(s+"T00:00:00");return DN[(d.getDay()+1)%7]+" "+d.getDate()+" "+MN[d.getMonth()+1]}
function render(p){
  if(!p.last){$("res").innerHTML='<div class="card"><div class="hi">أهلاً '+p.n+'</div><span class="pill">الشيفت: '+p.s+'</span>'+(p.off?'<span class="pill">الإجازة الأسبوعية: '+p.off+'</span>':"")+'</div><div class="card">جدول إجازاتك لسه ما اتسجلش في الروستر. كلّم الـ HR عشان يتم تحديثه.</div>';$("res").hidden=false;return}
  var off=new Set(p.wo),today=iso(new Date()),h="";
  var nx=p.wo.filter(function(x){return x>=today}).sort()[0];
  h+='<div class="card"><div class="hi">أهلاً '+p.n+'</div><span class="pill">الشيفت: '+p.s+'</span>'+(p.off?'<span class="pill">الإجازة الأسبوعية: '+p.off+'</span>':"")+'</div>';
  if(nx)h+='<div class="card next">أقرب إجازة لك: <b>'+fmt(nx)+'</b></div>';
  [10,11,12].forEach(function(m){
    var first=new Date(2026,m-1,1),n=new Date(2026,m,0).getDate(),lead=(first.getDay()+1)%7;
    if(new Date(2026,m-1,n)<new Date(2026,9,16))return;
    h+='<div class="card"><h3>'+MN[m]+' 2026</h3><div class="grid">'+DN.map(function(x){return'<div class="h">'+x.slice(0,3)+'</div>'}).join("");
    for(var i=0;i<lead;i++)h+="<div></div>";
    for(var d=1;d<=n;d++){var s="2026-"+("0"+m).slice(-2)+"-"+("0"+d).slice(-2),c="d";
      if(off.has(s))c+=" off";else if(s>p.last||s<"2026-10-16")c+=" out";
      if(s===today)c+=" today";
      h+='<div class="'+c+'">'+d+"</div>"}
    h+='</div><div class="leg">الأيام الحمراء = إجازة</div></div>';
  });
  h+='<p class="foot">الجدول متاح حتى '+fmt(p.last)+'. ما بعد كده الروستر لسه ما نزلش.</p>';
  $("res").innerHTML=h;$("res").hidden=false;
}
async function run(){
  $("err").hidden=true;$("res").hidden=true;$("go").disabled=true;$("go").textContent="جارٍ البحث…";
  var p=null;try{p=await lookup($("ph").value,DB,SALT)}catch(e){}
  $("go").disabled=false;$("go").textContent="عرض جدولي";
  if(!p){$("err").textContent="مفيش بيانات بالكود ده. تأكد إنك كتبت كود الموظف صح أو كلّم الـ HR.";$("err").hidden=false;return}
  render(p);
}
$("go").onclick=run;
$("ph").addEventListener("keydown",function(e){if(e.key==="Enter")run()});
var MNN={"2026-10":"أكتوبر 2026","2026-11":"نوفمبر 2026"};
var CL={PM:"P",PN:"P",PH:"PH",WO:"WO",AB:"AB",ABS:"ABS",SL:"SL",PL:"PL",EL:"EL","AB.":"NJ"};
var LG=[["P","PM / PN حضور"],["PH","PH أوفر تايم"],["WO","WO إجازة أسبوعية"],["AB","AB غياب بدون إذن"],["ABS","ABS غياب بإذن"],["SL","SL مرضي"],["PL","PL إجازة سنوية"],["EL","EL سنوية طارئة"],["NJ","AB. لسه ما بدأش"]];
function render2(p,mk){
  var ms=Object.keys(p.m).sort();if(!ms.length)return;mk=mk||ms[ms.length-1];
  var days=p.m[mk].split(","),y=+mk.slice(0,4),m=+mk.slice(5),lead=(new Date(y,m-1,1).getDay()+1)%7,c={};
  days.forEach(function(x){if(x)c[x]=(c[x]||0)+1});
  var pres=(c.PM||0)+(c.PN||0)+(c.PH||0),leave=(c.PL||0)+(c.EL||0);
  var h='<div class="card"><div class="hi">أهلاً '+p.n+'</div></div><div class="mt">'+ms.map(function(k){return'<button data-m="'+k+'" class="'+(k===mk?"on":"")+'">'+(MNN[k]||k)+'</button>'}).join("")+'</div>';
  h+='<div class="card"><div class="sum"><div><b>'+pres+'</b>أيام الحضور</div><div><b>'+(c.PH||0)+'</b>أوفر تايم</div><div><b>'+(c.AB||0)+'</b>غياب بدون إذن</div><div><b>'+(c.ABS||0)+'</b>غياب بإذن</div><div><b>'+(c.SL||0)+'</b>مرضي</div><div><b>'+leave+'</b>إجازة سنوية</div><div><b>'+(c.WO||0)+'</b>إجازة أسبوعية</div></div></div>';
  h+='<div class="card"><h3>'+(MNN[mk]||mk)+'</h3><div class="grid">'+DN.map(function(x){return'<div class="h">'+x.slice(0,3)+'</div>'}).join("");
  for(var i=0;i<lead;i++)h+="<div></div>";
  days.forEach(function(x,i){h+='<div class="d s '+(x?"c-"+(CL[x]||"X"):"")+'">'+(i+1)+(x?'<i>'+x+'</i>':'')+'</div>'});
  h+='</div><div class="lg">'+LG.map(function(l){return'<span class="c-'+l[0]+'">'+l[1]+'</span>'}).join("")+'</div></div>';
  $("res2").innerHTML=h;$("res2").hidden=false;
  Array.prototype.forEach.call($("res2").querySelectorAll(".mt button"),function(b){b.onclick=function(){render2(p,b.getAttribute("data-m"))}});
}
async function run2(){
  $("err2").hidden=true;$("res2").hidden=true;$("go2").disabled=true;$("go2").textContent="جارٍ البحث…";
  var p=null;try{p=await lookup($("ph2").value,ADB,ASALT)}catch(e){}
  $("go2").disabled=false;$("go2").textContent="عرض حضوري";
  if(!p){$("err2").textContent="مفيش بيانات حضور بالكود ده. تأكد إنك كتبت كود الموظف صح أو كلّم الـ HR.";$("err2").hidden=false;return}
  render2(p);
}
$("go2").onclick=run2;
$("ph2").addEventListener("keydown",function(e){if(e.key==="Enter")run2()});
Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){b.onclick=function(){
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(x){x.classList.toggle("on",x===b)});
  $("s1").hidden=b.getAttribute("data-t")!=="1";$("s2").hidden=b.getAttribute("data-t")!=="2"}});
</script>
</body>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استعلام الإجازات والشيفت</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mut:#657182;--ac:#1f6feb;--off:#e5484d;--offbg:#fde8e8;--bd:#dde2ea;--ok:#12805c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mut:#93a1b3;--ac:#5b9dff;--off:#ff7b80;--offbg:#3a2022;--bd:#2c3644;--ok:#4cc79a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mut:#93a1b3;--ac:#5b9dff;--off:#ff7b80;--offbg:#3a2022;--bd:#2c3644;--ok:#4cc79a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.35rem;margin:8px 0 4px}
p.sub{color:var(--mut);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin-bottom:8px}
input{width:100%;font-size:1.1rem;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);direction:ltr;text-align:center;letter-spacing:1px}
button{width:100%;margin-top:12px;font-size:1.05rem;font-weight:700;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--off);margin-top:10px;font-size:.95rem}
.hi{font-size:1.15rem;font-weight:700}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--bd);margin:6px 0 0 6px;font-size:.92rem}
.next{border-color:var(--ok);background:var(--card)}
.next b{color:var(--ok)}
h3{margin:0 0 10px;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.85rem}
.grid .h{color:var(--mut);font-size:.72rem}
.d{padding:6px 0;border-radius:8px}
.d.off{background:var(--offbg);color:var(--off);font-weight:700}
.d.out{color:var(--mut);opacity:.45}
.d.today{outline:2px solid var(--ac)}
.leg{color:var(--mut);font-size:.82rem;margin-top:8px}
.foot{color:var(--mut);font-size:.82rem;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>استعلام الإجازات والشيفت</h1>
<p class="sub">اكتب كود الموظف الخاص بك لتشوف شيفتك وأيام إجازتك.</p>
<div class="card" id="f">
<label for="ph">كود الموظف</label>
<input id="ph" type="tel" inputmode="numeric" autocomplete="off" placeholder="مثال: 1036" maxlength="10">
<button id="go">عرض جدولي</button>
<div class="err" id="err" hidden></div>
</div>
<div id="res" hidden></div>
<p class="foot">لو بياناتك مش ظاهرة أو فيها خطأ، كلّم الـ HR.</p>
</main>

    h+='</div><div class="leg">الأيام الحمراء = إجازة</div></div>';
  });
  h+='<p class="foot">الجدول متاح حتى '+fmt(p.last)+'. ما بعد كده الروستر لسه ما نزلش.</p>';
  $("res").innerHTML=h;$("res").hidden=false;
}
async function run(){
  $("err").hidden=true;$("res").hidden=true;$("go").disabled=true;$("go").textContent="جارٍ البحث…";
  var p=null;try{p=await lookup($("ph").value)}catch(e){}
  $("go").disabled=false;$("go").textContent="عرض جدولي";
  if(!p){$("err").textContent="مفيش بيانات بالكود ده. تأكد إنك كتبت كود الموظف صح أو كلّم الـ HR.";$("err").hidden=false;return}
  render(p);
}
$("go").onclick=run;
$("ph").addEventListener("keydown",function(e){if(e.key==="Enter")run()});
</script>
</body>
</html>
